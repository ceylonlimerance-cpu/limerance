<style>
/* ============ tokens ============ */
:root{
  --brand:#2FD9A8; --rose:#FF6183; --amber:#FFBC4D; --violet:#A78BFA; --sky:#5AB8FF;
  --rad:18px; --rad2:12px; --rad3:9px;
  --blur:blur(20px) saturate(150%);
  --ease:cubic-bezier(.32,.72,0,1);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080B10; --ink:#E9EEF4; --sub:#9DA9B8; --faint:#6A7684;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075); --glassHi:rgba(255,255,255,.11);
  --stroke:rgba(255,255,255,.085); --stroke2:rgba(255,255,255,.16);
  --tintRose:rgba(255,97,131,.14); --tintAmber:rgba(255,188,77,.14);
  --tintBrand:rgba(47,217,168,.14); --tintVio:rgba(167,139,250,.14);
  --shadow:0 18px 44px rgba(0,0,0,.45); --scrim:rgba(4,7,11,.66);
  --b1:#0E7A5E; --b2:#1D3B6E; --b3:#5B2148;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#E7EAEF; --ink:#0B1119; --sub:#4B5665; --faint:#78838F;
  --brand:#0B8C69; --rose:#D42B52; --amber:#9E6600; --violet:#6247C4; --sky:#1F74C4;
  --glass:rgba(255,255,255,.60); --glass2:rgba(255,255,255,.78); --glassHi:rgba(255,255,255,.92);
  --stroke:rgba(11,17,25,.09); --stroke2:rgba(11,17,25,.17);
  --tintRose:rgba(212,43,82,.10); --tintAmber:rgba(158,102,0,.12);
  --tintBrand:rgba(11,140,105,.11); --tintVio:rgba(98,71,196,.11);
  --shadow:0 14px 36px rgba(11,17,25,.12); --scrim:rgba(210,215,222,.6);
  --b1:#9FD8C6; --b2:#AFC4E6; --b3:#E3BCD2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background .3s var(--ease),color .3s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
input,select,textarea{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ the surface the glass blurs against ============ */
#mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
#mesh i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5}
html[data-theme="light"] #mesh i{opacity:.55;filter:blur(80px)}
#mesh i:nth-child(1){width:52vw;height:52vw;background:var(--b1);top:-16vw;left:-10vw}
#mesh i:nth-child(2){width:46vw;height:46vw;background:var(--b2);bottom:-18vw;right:-8vw}
#mesh i:nth-child(3){width:34vw;height:34vw;background:var(--b3);top:38%;left:44%}

/* ============ glass ============ */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:var(--rad)}
.glass2{background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke)}
.solid{background:var(--glass2);border:1px solid var(--stroke);border-radius:var(--rad)}

/* ============ shell ============ */
#app{display:grid;grid-template-columns:240px 1fr;height:100dvh;overflow:hidden}
aside#side{display:flex;flex-direction:column;padding:16px 12px 12px;gap:4px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-right:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.mark{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(140deg,#0B6E56,#2FD9A8);box-shadow:0 4px 14px rgba(47,217,168,.3)}
.mark img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.wordmark{width:186px;height:57px;display:block;position:relative;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:57px;color:#D8B672}
html[data-theme="light"] .wordmark{color:#6B542C}

html[data-theme="light"] .wordmark{background-color:#6B542C}
.brand.hasLogo .mark{display:none}
.authcard .wordmark{width:232px;height:71px;line-height:71px;font-size:19px;text-align:center;
  margin:0 auto 18px;-webkit-mask-position:center;mask-position:center}
.brand b{font-size:14.5px;font-weight:600;letter-spacing:-.015em;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--faint);display:block}
nav.rail{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow-y:auto}
.nl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--rad3);
  color:var(--sub);font-size:13.5px;font-weight:500;width:100%;text-align:left;position:relative;
  transition:background .16s var(--ease),color .16s var(--ease)}
.nl:hover{background:var(--glass2);color:var(--ink)}
.nl.on{background:var(--glassHi);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
.nl.on::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:2.5px;border-radius:99px;
  background:var(--brand);box-shadow:0 0 10px var(--brand)}
.nl svg{width:18px;height:18px;flex-shrink:0}
.nb{margin-left:auto;background:var(--rose);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;
  height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px;font-family:'IBM Plex Mono',monospace}
.sidefoot{border-top:1px solid var(--stroke);padding-top:10px;margin-top:6px;display:flex;gap:6px}
.uchip{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--rad3);flex:1;
  text-align:left;min-width:0;transition:background .16s}
.uchip:hover{background:var(--glass2)}
.uchip b{font-size:12.5px;font-weight:600;display:block;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uchip span{font-size:10.5px;color:var(--faint);display:block}
.tbtn{width:36px;flex-shrink:0;border-radius:var(--rad3);display:grid;place-items:center;color:var(--sub);
  transition:background .16s,color .16s}
.tbtn:hover{background:var(--glass2);color:var(--ink)}
.tbtn svg{width:17px;height:17px}

section#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header#top{height:64px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 24px;
  border-bottom:1px solid var(--stroke);background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
header#top h1{font-size:19px;font-weight:600;letter-spacing:-.025em}
.crumb{font-size:11.5px;color:var(--faint);line-height:1.2;display:block}
.topr{margin-left:auto;display:flex;align-items:center;gap:9px}
#view{flex:1;overflow-y:auto;padding:20px 24px 40px;scroll-behavior:smooth}
.wrap{max-width:1440px;margin:0 auto}

/* ============ bento ============ */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:13px;grid-auto-rows:minmax(84px,auto)}
.b2{grid-column:span 2}.b3{grid-column:span 3}.b4{grid-column:span 4}.b5{grid-column:span 5}
.b6{grid-column:span 6}.b7{grid-column:span 7}.b8{grid-column:span 8}.b9{grid-column:span 9}
.b12{grid-column:span 12}
.r2{grid-row:span 2}.r3{grid-row:span 3}.r4{grid-row:span 4}
.cell{padding:16px 18px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.cell.scroll{overflow-y:auto}
.cell h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.cellhead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-shrink:0}
.cellhead .more{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:500}

/* ============ type ============ */
.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:600}
.sub{font-size:13px;color:var(--sub)}
.tiny{font-size:11.5px;color:var(--faint)}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.big{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;line-height:1;letter-spacing:-.03em}
.mid{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1.1;letter-spacing:-.02em}

/* ============ bits ============ */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;
  border-radius:99px;background:var(--glass2);color:var(--sub);white-space:nowrap;
  border:1px solid var(--stroke)}
.c-rose{background:var(--tintRose);color:var(--rose);border-color:transparent}
.c-amb{background:var(--tintAmber);color:var(--amber);border-color:transparent}
.c-brand{background:var(--tintBrand);color:var(--brand);border-color:transparent}
.c-vio{background:var(--tintVio);color:var(--violet);border-color:transparent}
.av{width:22px;height:22px;border-radius:99px;display:inline-grid;place-items:center;font-size:9.5px;
  font-weight:700;color:#fff;flex-shrink:0;font-style:normal}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;
  border-radius:var(--rad3);font-size:13px;font-weight:600;transition:transform .12s,opacity .16s,background .16s;
  background:var(--brand);color:#04160F;white-space:nowrap}
html[data-theme="light"] .btn{color:#fff}
.btn:hover{opacity:.9}.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--stroke)}
.btn.ghost:hover{background:var(--glassHi)}
.btn.danger{background:var(--tintRose);color:var(--rose);border:1px solid transparent}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.in{width:100%;border:1px solid var(--stroke);border-radius:var(--rad3);padding:10px 13px;
  font-size:14px;background:var(--glass2);color:var(--ink);transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--tintBrand)}
select.in{appearance:none;-webkit-appearance:none;background-image:
  linear-gradient(45deg,transparent 50%,currentColor 50%),
  linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 51%,calc(100% - 12px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;
  font-weight:500}
select.in option{background:#12161C;color:#E9EEF4;font-weight:500}
html[data-theme="light"] select.in option{background:#fff;color:#0B1119}

/* the allocated editors, stated plainly instead of hidden in a dropdown */
.crewstrip{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.person{display:flex;align-items:center;gap:9px;padding:8px 13px 8px 9px;border-radius:99px;
  background:var(--glass2);border:1px solid var(--stroke)}
.person .pl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-weight:600;line-height:1.2;display:block}
.person .pv{font-size:13.5px;font-weight:600;line-height:1.25;display:block}
.person.none .pv{color:var(--rose)}
.lab{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field{margin-bottom:13px}
.search{position:relative;flex:1;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  color:var(--faint)}
.search .in{padding-left:35px}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--rad3);
  padding:3px;gap:2px}
.seg button{padding:6px 14px;font-size:12.5px;font-weight:600;border-radius:7px;color:var(--sub);
  transition:background .16s,color .16s}
.seg button.on{background:var(--glassHi);color:var(--ink)}
.toggle{width:40px;height:23px;border-radius:99px;background:var(--stroke2);position:relative;flex-shrink:0;
  transition:background .18s var(--ease)}
.toggle.on{background:var(--brand)}
.toggle i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:99px;background:#fff;
  transition:transform .18s var(--ease);display:block}
.toggle.on i{transform:translateX(17px)}
.ring text{font-family:'IBM Plex Mono',monospace;font-weight:600;fill:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--stroke);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px}
.sep{height:1px;background:var(--stroke);margin:13px 0}
.stack{display:flex;flex-direction:column;gap:9px}
.rowf{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}

/* ============ task ============ */
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border-radius:var(--rad2);
  background:var(--glass);border:1px solid var(--stroke);transition:background .16s,border-color .16s}
.task:hover{background:var(--glass2);border-color:var(--stroke2)}
.task.late{border-left:2.5px solid var(--rose)}
.task.soon{border-left:2.5px solid var(--amber)}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.tick{width:22px;height:22px;flex-shrink:0;border:1.6px solid var(--stroke2);border-radius:7px;
  display:grid;place-items:center;margin-top:1px;transition:background .14s,border-color .14s;
  background:var(--glass2)}
.tick:hover:not(:disabled){border-color:var(--brand)}
.tick.on{background:var(--brand);border-color:var(--brand)}
.tick svg{width:13px;height:13px;stroke:#04160F;stroke-width:3.2;fill:none;opacity:0}
html[data-theme="light"] .tick svg{stroke:#fff}
.tick.on svg{opacity:1}
.tick:disabled{opacity:.4;cursor:not-allowed}
.tick.busy{opacity:.35}
.tbody{flex:1;min-width:0}
.tt{font-size:13.5px;font-weight:500;line-height:1.4}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);font-weight:500}
.stamp{font-size:11.5px;color:var(--brand);margin-top:6px;font-weight:500}
.noteline{margin-top:8px}
.noteline input{width:100%;border:1px dashed var(--stroke2);border-radius:7px;padding:6px 9px;
  font-size:12.5px;background:transparent;color:var(--sub)}
.noteline input:focus{border-style:solid;border-color:var(--brand);background:var(--glass2)}

/* ============ phase nav ============ */
.flowgrid{display:grid;grid-template-columns:206px 1fr;gap:18px;align-items:start}
.phnav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.phbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rad3);width:100%;
  text-align:left;font-size:12.5px;font-weight:500;color:var(--sub);transition:background .16s}
.phbtn:hover{background:var(--glass2);color:var(--ink)}
.phbtn .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phbtn .pc{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint)}
.mini{width:24px;height:3.5px;background:var(--stroke2);border-radius:99px;overflow:hidden;flex-shrink:0}
.mini i{display:block;height:100%;background:var(--brand)}
.phsec{margin-bottom:20px;scroll-margin-top:10px}
.phhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.phhead h3{font-size:14px;font-weight:600;letter-spacing:-.015em}

/* ============ table ============ */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;padding:0 11px 9px;border-bottom:1px solid var(--stroke);white-space:nowrap}
table.t td{padding:10px 11px;border-bottom:1px solid var(--stroke);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr.warn td{background:var(--tintRose)}

/* ============ notices ============ */
.notice{border-radius:var(--rad2);padding:13px 16px;display:flex;gap:12px;align-items:flex-start;font-size:13px;
  border:1px solid transparent}
.n-rose{background:var(--tintRose);color:var(--rose);border-color:var(--rose)}
.n-amb{background:var(--tintAmber);color:var(--amber);border-color:var(--amber)}
.notice b{display:block;font-weight:600;margin-bottom:2px}
.notice .nb2{flex:1;min-width:0}
html[data-theme="dark"] .n-rose{color:#FFC2CF}
html[data-theme="dark"] .n-amb{color:#FFE0AE}
.alarm{border-radius:var(--rad2);padding:14px 16px;display:flex;gap:13px;align-items:center;
  background:linear-gradient(135deg,var(--tintRose),transparent);border:1px solid var(--rose)}
.alarm .bell{font-size:19px;animation:shake 2.2s ease-in-out infinite;line-height:1}
@keyframes shake{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-13deg)}94%{transform:rotate(13deg)}97%{transform:rotate(-5deg)}}
.alarm b{font-size:13.5px;display:block;font-weight:600}
.feed{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--stroke);font-size:12.5px;
  align-items:flex-start}
.feed:last-child{border-bottom:none}
.feed .fw{flex:1;min-width:0}
.feed .ft{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);white-space:nowrap}

/* ============ overlay ============ */
.ov{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:90;padding:18px;animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke2);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:500px;
  max-height:88dvh;overflow-y:auto;padding:22px 24px 24px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal h2{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:-.02em}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:99px;
  font-size:13px;z-index:99;font-weight:500;background:var(--glass2);border:1px solid var(--stroke2);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);
  animation:pop .22s var(--ease);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--rose);color:#fff;border-color:transparent}
.empty{text-align:center;padding:56px 24px;color:var(--faint)}
.empty b{display:block;font-size:15px;color:var(--sub);margin-bottom:6px;font-weight:600}
.spin{display:grid;place-items:center;padding:70px 0}
.spin i{width:26px;height:26px;border:2.5px solid var(--stroke2);border-top-color:var(--brand);
  border-radius:99px;display:block;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ auth ============ */
#auth{display:grid;place-items:center;height:100dvh;padding:20px;overflow-y:auto}
.authcard{width:100%;max-width:400px;padding:30px 28px 26px;border-radius:22px;box-shadow:var(--shadow)}
.authcard .mark{width:44px;height:44px;border-radius:14px;font-size:16px;margin-bottom:16px}
.authcard h1{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-bottom:5px}
.authcard .sub{margin-bottom:20px}
.authswap{margin-top:16px;text-align:center;font-size:12.5px;color:var(--sub)}
.authswap button{color:var(--brand);font-weight:600}

/* ============ mobile ============ */
@media(max-width:1120px){ .flowgrid{grid-template-columns:1fr} .phnav{display:none}
  .b3{grid-column:span 6}.b4{grid-column:span 6}.b5,.b7,.b8,.b9{grid-column:span 12} }
@media(max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside#side{grid-row:2;flex-direction:row;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    border-right:none;border-top:1px solid var(--stroke);gap:2px}
  .brand,.sidefoot{display:none}
  nav.rail{flex-direction:row;gap:2px;overflow:visible}
  .nl{flex-direction:column;gap:4px;font-size:10px;padding:8px 2px;justify-content:center;flex:1}
  .nl.on::before{left:28%;right:28%;top:0;bottom:auto;width:auto;height:2.5px}
  .nl .nb{position:absolute;top:1px;right:50%;margin-right:-19px}
  header#top{height:58px;padding:0 14px;padding-top:env(safe-area-inset-top)}
  header#top h1{font-size:17px}
  #view{padding:14px 14px 26px}
  .bento{gap:11px;grid-auto-rows:minmax(74px,auto)}
  .b2,.b3,.b4,.b5,.b6,.b7,.b8,.b9{grid-column:span 12}
  .grid3,.grid2{grid-template-columns:1fr}
  .big{font-size:26px}
  .search{max-width:none}
}

/* ==========================================================================
   iPhone 13-17 layout fixes (appended: later rules win on source order)
   ========================================================================== */

/* Viewport height that also works on iOS 15, where dvh does not exist yet. */
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;overscroll-behavior:none}
#app{height:100vh;height:-webkit-fill-available;height:100dvh}
#auth{height:100vh;height:-webkit-fill-available;height:100dvh;
  padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}

/* Nothing may outgrow its column. A date input reports a wide intrinsic size,
   and without min-width:0 it stretches the grid past the screen edge. */
input,select,textarea,button{max-width:100%;min-width:0}
.field,.grid2>*,.grid3>*{min-width:0}
input[type=date],input[type=month],input[type=time]{
  -webkit-appearance:none;appearance:none;text-align:left}

/* Dialogs clear the Dynamic Island and the home indicator. */
.ov{padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
           calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.modal{max-height:calc(100vh - 40px);
  max-height:calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.toast{bottom:calc(24px + env(safe-area-inset-bottom))}

@media(max-width:860px){
  /* The header must GROW by the status-bar inset, not swallow it. With
     box-sizing:border-box the old rule left ~10px for the title on any
     phone with a notch or Dynamic Island. */
  header#top{height:calc(58px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) calc(14px + env(safe-area-inset-right))
            0 calc(14px + env(safe-area-inset-left));
    align-items:center}

  /* 16px is the threshold below which iOS zooms the page on focus. */
  .in,input,select,textarea{font-size:16px}
  .noteline input{font-size:15px}
  .seg button{font-size:13px}

  /* Curved edges and landscape insets. */
  aside#side{padding-left:calc(6px + env(safe-area-inset-left));
    padding-right:calc(6px + env(safe-area-inset-right))}
  #view{padding:14px calc(14px + env(safe-area-inset-right)) 26px calc(14px + env(safe-area-inset-left))}

  /* Toast clears the bottom nav bar as well as the home indicator. */
  .toast{bottom:calc(74px + env(safe-area-inset-bottom))}
}

<script>

var DLED = [], DSAL = [
  { row:2, name:'Kalindu',  monthly:85000, active:true,  started:shift(-400), note:'Photo editor' },

];
(function seedLedger(){
  var n = new Date(), row = 2;
  function add(dAgo, dir, cat, wed, note, amt) {
    var d = new Date(n); d.setDate(d.getDate() - dAgo);

  add(22, 'Out','Freelancer','Nimesha & Sahan','Chathura P.',35000);
  add(22, 'Out','Freelancer','Nimesha & Sahan','Sanjaya K.',22000);
  add(12, 'Out','Colour lab','Nimesha & Sahan','40pg album print',18500);
  add(8,  'In','Album and frames','Nimesha & Sahan','2 extra frames',14000);
  add(35, 'Out','Rent','','Studio rent',65000);
  add(5,  'Out','Rent','','Studio rent',65000);
  add(33, 'Out','Transport','','Fuel and hires',18200);
  add(9,  'Out','Transport','','Fuel and hires',15400);
  add(30, 'Out','Equipment','','Lens service',24000);
  add(28, 'Out','Marketing','','Instagram ads',12000);
  add(31, 'Out','Salary','','Kalindu | ' + shift(-31).slice(0,7), 85000);
  add(31, 'Out','Salary','','Indula | '  + shift(-31).slice(0,7), 95000);
  add(31, 'Out','Salary','','Mayantha | '+ shift(-31).slice(0,7),110000);
  add(2,  'Out','Salary','','Kalindu | ' + shift(0).slice(0,7),  85000);
})();
function inR(d,f,t){ return (!f||d>=f)&&(!t||d<=t) }

D.ledger = function (a) {
  return DLED.filter(function (e) { return inR(e.date, a.from, a.to) })
             .sort(function (x,y) { return x.date < y.date ? 1 : -1 });
};
D.addEntry = function (a) {
  if (!a.amount || Number(a.amount) <= 0) throw new Error('Put in an amount.');
  DLED.push({ row: Math.max.apply(null, DLED.map(function(e){return e.row}).concat([1])) + 1,
    date:a.date, dir:a.dir, category:a.category, wedding:a.wedding||'', note:a.note||'',
    amount:Number(a.amount), method:a.method||'', by:DME.name });
  dlog(a.wedding||'', '', (a.dir==='In'?'money in: ':'money out: ') + a.amount);
  return { ok:true };
};
D.deleteEntry = function (a) {
  var i = DLED.map(function(e){return e.row}).indexOf(a.row);
  if (i > -1) DLED.splice(i,1);
  return { ok:true };
};
D.pnl = function (a) {
  var rows = DLED.filter(function (e) { return inR(e.date, a.from, a.to) });
  var income={}, expense={}, inTot=0, outTot=0, byWedding={}, byMonth={};
  rows.forEach(function (e) {
    var bag = e.dir==='In' ? income : expense;
    bag[e.category] = (bag[e.category]||0) + e.amount;
    if (e.dir==='In') inTot += e.amount; else outTot += e.amount;
    if (e.wedding) { if (!byWedding[e.wedding]) byWedding[e.wedding]={inn:0,out:0};
      byWedding[e.wedding][e.dir==='In'?'inn':'out'] += e.amount; }
    var m = e.date.slice(0,7);
    if (!byMonth[m]) byMonth[m]={inn:0,out:0};
    byMonth[m][e.dir==='In'?'inn':'out'] += e.amount;
  });
  var direct = (expense['Freelancer']||0) + (expense['Colour lab']||0);
  var salary = expense['Salary']||0;
  return { from:a.from||'', to:a.to||'', count:rows.length, income:income, expense:expense,
    inTot:inTot, outTot:outTot, direct:direct, salary:salary,
    overhead: outTot-direct-salary, gross: inTot-direct, net: inTot-outTot,
    byWedding:byWedding, byMonth:byMonth };
};
D.salaries = function (a) {
  var month = a.month || shift(0).slice(0,7);
  var paid = {};
  DLED.forEach(function (e) {
    if (e.category !== 'Salary' || e.note.indexOf(month) === -1) return;
    paid[e.note.split('|')[0].trim()] = { amount:e.amount, date:e.date, row:e.row };
  });
  var have = DSAL.map(function(p){return p.name});
  var people = DSAL.slice();
  dstaff().forEach(function (n) {
    if (have.indexOf(n) === -1) people.push({ row:null, name:n, monthly:0, active:true, started:'', note:'' });
  });
  return { month:month, people:people, paid:paid,
    due: people.filter(function(p){return p.active}).reduce(function(s,p){return s+p.monthly},0) };
};
D.setSalary = function (a) {
  var p = DSAL.filter(function(x){return x.name===a.name})[0];
  if (!p) { p = { row:DSAL.length+2, name:a.name, monthly:0, active:true, started:'', note:'' }; DSAL.push(p); }
  p.monthly = Number(a.monthly)||0;
  if (a.active !== undefined) p.active = !!a.active;
  return { ok:true };
};
D.paySalary = function (a) {
  DLED.push({ row: Math.max.apply(null, DLED.map(function(e){return e.row})) + 1,
    date:a.date, dir:'Out', category:'Salary', wedding:'',
    note:a.name + ' | ' + a.month, amount:Number(a.amount)||0, method:a.method||'', by:DME.name });
  dlog('', '', 'paid ' + a.name + ' salary for ' + a.month);
  return { ok:true };
};
D.dueSoon = function () {
  var o = [];
  DW.forEach(function (w) { w.rows.forEach(function (r) {
    if (r.done || r.who !== DME.name || r.diff > 2) return;
    o.push({ couple:w.name, row:r.row, n:r.n, task:r.task, due:r.due, diff:r.diff, alarm:r.alarm });
  }) });
  return o.sort(function (a,b) { return a.diff - b.diff });
};
</script>

<script>
/* ================= state ================= */
var S = { user:null, weddings:[], view:'work', open:null, sub:'flow', bt:'workload',
          q:'', busy:{}, data:null, authMode:'login', installEvt:null };

/* ================= auth screens ================= */
function authView() {
  var reg = S.authMode === 'register';
  document.getElementById('root').innerHTML =
   '<div id="auth"><div class="authcard glass">'

       + '<input class="in" id="aName" placeholder="How the team knows you"></div>' : '')
   + '<div class="field"><label class="lab">Password</label>'

   + '<div class="authswap">' + (reg
       ? 'Already set up? <button onclick="S.authMode=\'login\';authView()">Sign in</button>'
       : 'First time here? <button onclick="S.authMode=\'register\';authView()">Set up your sign-in</button>')
   + '</div>'
   + (DEMO ? '<div class="notice n-amb" style="margin-top:18px;font-size:12px">'
       + '<div class="nb2"><b>Sample mode</b>API_URL is not set yet, so this is running on made-up data. '
       + 'Try <span class="mono">malith@demo.lk</span> with <span class="mono">demo1234</span>.</div></div>' : '')
   + '<div style="margin-top:16px;text-align:center">'
   + '<button class="tbtn" style="width:auto;padding:6px 10px;display:inline-flex;gap:6px;font-size:12px"'
   + ' onclick="flipTheme();authView()">' + svg(theme()==='dark'?'sun':'moon','width="15" height="15"')
   + '<span>' + (theme()==='dark'?'Day mode':'Night mode') + '</span></button></div>'
   + '</div></div>';
  var go = function (e) { if (e.key === 'Enter') doAuth() };
  ['aEmail','aName','aPw'].forEach(function (id) { var el = document.getElementById(id); if (el) el.onkeydown = go });
  applyLogo();
}
function doAuth() {
  var reg = S.authMode === 'register';
  var email = ($('#aEmail').value || '').trim();
  var pw = $('#aPw').value || '';
  var name = reg ? ($('#aName').value || '').trim() : '';
  if (!email) return toast('Enter your email', true);
  if (!pw) return toast('Enter your password', true);
  if (reg && !name) return toast('Tell us your name', true);
  var b = $('#aGo'); b.disabled = true; b.textContent = reg ? 'Creating...' : 'Signing in...';
  api(reg ? 'register' : 'login', { email:email, password:pw, name:name })

      b.disabled = false; b.textContent = reg ? 'Create my sign-in' : 'Sign in';
      toast(e.message, true);
    });
}
function signOut() {
  api('logout').catch(function () {});
  signOutLocal(); S.user = null; S.authMode = 'login';
  document.getElementById('root').innerHTML = ''; authView();
}

/* ================= task row ================= */
function taskRow(r, couple, showCouple, editable) {
  var cls = r.done ? 'done' : r.diff < 0 ? 'late' : r.diff <= 3 ? 'soon' : '';
  var lbl = r.done ? '<span class="chip c-brand">done</span>'
    : r.diff < 0 ? '<span class="chip c-rose">' + Math.abs(r.diff) + ' days late</span>'
    : r.diff === 0 ? '<span class="chip c-amb">today</span>'
    : r.diff <= 3 ? '<span class="chip c-amb">in ' + r.diff + ' days</span>'
    : '<span class="chip">' + fmt(r.due) + '</span>';
  var mine = r.who === S.user.name || S.user.role === 'Owner';
  var k = couple + ':' + r.row;
  return '<div class="task ' + cls + '">'
   + '<button class="tick' + (r.done?' on':'') + (S.busy[k]?' busy':'') + '"' + (mine?'':' disabled')
   + ' onclick="doTick(\'' + esc(couple) + '\',' + r.row + ',' + (!r.done) + ')" aria-label="Mark done">'
   + svg('check') + '</button>'
   + '<div class="tbody"><div class="tt">' + esc(r.task) + '</div><div class="tmeta">'
   + '<span class="num">' + r.n + '</span>' + lbl
   + (r.alarm ? '<span class="chip c-rose">&#9200; daily</span>' : '')
   + av(r.who, 20) + '<span class="tiny">' + esc(r.who) + '</span>'
   + (showCouple ? '<button class="chip" onclick="openW(\'' + esc(couple) + '\')">'
       + esc(couple) + '</button>' : '')
   + '</div>'
   + (r.done && r.by ? '<div class="stamp">&#10003; ' + esc(r.by) + '</div>' : '')
   + (editable
      ? '<div class="noteline"><input value="' + esc(r.note) + '" placeholder="Add a note"'
        + ' onblur="doNote(\'' + esc(couple) + '\',' + r.row + ',this.value)"></div>'
      : (r.note ? '<div class="noteline"><div class="tiny">' + esc(r.note) + '</div></div>' : ''))
   + '</div></div>';
}
function doTick(couple, row, val) {
  var k = couple + ':' + row; if (S.busy[k]) return;
  S.busy[k] = 1;
  var cache = S.data && S.open === couple
    ? S.data.rows.filter(function (r) { return r.row === row })[0] : null;
  if (cache) { cache.done = val; cache.by = val ? S.user.name : ''; paintDetail(); }
  api('tick', { name:couple, row:row, value:val }).then(function () {
    delete S.busy[k]; toast(val ? 'Ticked' : 'Un-ticked');
    if (S.open === couple) openW(couple, true); else refresh();
  }).catch(function (e) {
    delete S.busy[k];
    if (cache) { cache.done = !val; paintDetail(); }
    toast(e.message || 'Could not save.', true);
  });
}
function doNote(couple, row, text) {
  var cache = S.data && S.data.rows.filter(function (r) { return r.row === row })[0];
  if (cache && cache.note === text) return;
  if (cache) cache.note = text;
  api('setNote', { name:couple, row:row, text:text })
    .then(function () { toast('Note saved') })
    .catch(function (e) { toast(e.message || 'Could not save the note', true) });
}

/* ================= your work (bento) ================= */
function viewWork() {
  spin();
  api('myWork').then(function (list) {
    var over = list.filter(function (r) { return r.diff < 0 });
    var soon = list.filter(function (r) { return r.diff >= 0 && r.diff <= 3 });
    var later = list.filter(function (r) { return r.diff > 3 });
    var alarms = over.filter(function (r) { return r.alarm });
    var totals = S.weddings.reduce(function (a, w) {
      a.done += w.done; a.total += w.total; return a }, { done:0, total:0 });
    var pct = totals.total ? Math.round(totals.done / totals.total * 100) : 0;

    var h = '<div class="wrap"><div class="bento">'
     + tile('b3','Late', over.length, over.length ? 'var(--rose)' : 'var(--brand)')
     + tile('b3','Due in 3 days', soon.length, soon.length ? 'var(--amber)' : 'var(--sub)')
     + tile('b3','On you', list.length, 'var(--ink)')
     + '<div class="glass cell b3" style="align-items:center;justify-content:center;flex-direction:row;gap:14px">'
     + ring(pct, 56, 5, 13)
     + '<div><div class="eyebrow">All weddings</div>'
     + '<div class="tiny" style="margin-top:3px">' + totals.done + ' of ' + totals.total + ' steps</div></div></div>';

    if (alarms.length) {
      h += '<div class="glass cell b12"><div class="cellhead">'
        + '<h3>Ringing right now</h3><span class="chip c-rose">' + alarms.length + '</span></div>'
        + '<div class="stack">' + alarms.slice(0, 3).map(function (a) {
            return '<div class="alarm"><span class="bell">&#9200;</span>'
              + '<div style="flex:1;min-width:0"><b>' + esc(a.task) + '</b>'
              + '<div class="tiny">' + esc(a.couple) + ' &middot; ' + Math.abs(a.diff) + ' days late</div></div>'
              + '<button class="btn sm ghost" onclick="openW(\'' + esc(a.couple) + '\')">Open</button></div>';
          }).join('') + '</div></div>';
    }

    if (!list.length) {
      h += '<div class="glass cell b12"><div class="empty"><b>Nothing waiting on you.</b>'
        + 'Steps land here as each wedding moves along.</div></div>';
    } else {
      h += '<div class="glass cell b8 scroll" style="max-height:600px">'
        + '<div class="cellhead"><h3>Your list</h3>'
        + '<span class="more">' + list.length + ' open</span></div><div class="stack">'
        + (over.length ? sectionLabel('Late') + over.map(function (r) { return taskRow(r, r.couple, true) }).join('') : '')
        + (soon.length ? sectionLabel('Next three days') + soon.map(function (r) { return taskRow(r, r.couple, true) }).join('') : '')
        + (later.length ? sectionLabel('Coming up') + later.slice(0,10).map(function (r) { return taskRow(r, r.couple, true) }).join('') : '')
        + '</div></div>'
        + '<div class="glass cell b4 scroll" style="max-height:600px">'
        + '<div class="cellhead"><h3>Weddings</h3></div><div class="stack">'
        + S.weddings.map(miniWedding).join('') + '</div></div>';
    }
    $('#view').innerHTML = h + '</div></div>';
  }).catch(fail);
}
function tile(span, label, n, colour) {
  return '<div class="glass cell ' + span + '"><div class="eyebrow">' + label + '</div>'
    + '<div class="big" style="color:' + colour + ';margin-top:auto;padding-top:10px">' + n + '</div></div>';
}
function sectionLabel(t) {
  return '<div class="eyebrow" style="margin:6px 0 2px">' + t + '</div>';
}
function miniWedding(w) {
  var pct = w.total ? Math.round(w.done / w.total * 100) : 0;
  var n = w.date ? Math.round((new Date(w.date + 'T00:00:00') - T0) / 864e5) : null;
  return '<button class="task" style="width:100%;text-align:left" onclick="openW(\'' + esc(w.name) + '\')">'
   + ring(pct, 34, 3.5, 9)
   + '<div class="tbody"><div class="tt">' + esc(w.name) + '</div>'
   + '<div class="tmeta"><span class="tiny mono">' + fmt(w.date)
   + (n === null ? '' : ' &middot; ' + (n > 0 ? 'in ' + n + 'd' : n === 0 ? 'today' : Math.abs(n) + 'd ago'))
   + '</span>' + (w.late ? '<span class="chip c-rose">' + w.late + ' late</span>' : '')
   + (w.clash ? '<span class="chip c-rose">clash</span>' : '') + '</div></div></button>';
}
</script>
