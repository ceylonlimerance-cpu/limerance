  api('addWedding', { name:n, date:$('#nd').value, phone:$('#np').value, venue:$('#nv').value,
      pkg:$('#nk').value, total:$('#nt').value, received:$('#na').value })
   .then(function (r) { closeOv(); toast(r.warning || (n + ' created'), !!r.warning);
     refresh(function () { openW(n) }); })
   .catch(function (e) { b.disabled = false; b.textContent = 'Create'; toast(e.message, true) });
}

/* ================= wedding detail ================= */
function openW(name, keepSub) {
  S.open = name; S.view = 'list'; if (!keepSub) S.sub = 'flow';
  paintShell(); spin();
  api('wedding', { name:name }).then(function (d) {
    S.data = d; paintDetail(); if (!keepSub) $('#view').scrollTop = 0;
  }).catch(fail);
}
function paintDetail() {
  if (S.view !== 'list' || !S.open || !S.data) return;
  var d = S.data, h = d.head, rows = d.rows;
  var done = rows.filter(function (r) { return r.done }).length;
  var late = rows.filter(function (r) { return !r.done && r.diff < 0 });
  var pct = Math.round(done / rows.length * 100);
  var owed = d.crew.reduce(function (s, c) { return s + (c.paid ? 0 : c.fee) }, 0);
  var n = h.date ? Math.round((new Date(h.date + 'T00:00:00') - T0) / 864e5) : null;

  var out = '<div class="wrap">'
   + '<button class="chip" style="margin-bottom:12px" onclick="S.open=null;render()">'
   + svg('back','width="12" height="12"') + ' All weddings</button>'
   + '<div class="glass cell" style="padding:18px 20px;margin-bottom:13px">'
   + '<div class="rowf" style="align-items:flex-start;flex-wrap:wrap">'
   + '<div style="flex:1;min-width:200px"><div style="font-size:21px;font-weight:600;letter-spacing:-.03em">'
   + esc(h.name) + '</div><div class="tiny mono" style="margin-top:4px">' + fmt(h.date)
   + (n === null ? '' : ' &middot; ' + (n > 0 ? 'in ' + n + ' days' : n === 0 ? 'TODAY' : Math.abs(n) + ' days ago'))
   + ' &middot; ' + esc(h.venue || 'venue not set') + '</div>'
   + '<div class="tmeta" style="margin-top:10px">'
   + (late.length ? '<span class="chip c-rose">' + late.length + ' late</span>'
                  : '<span class="chip c-brand">on track</span>')
   + '<span class="chip">' + (h.total - h.received > 0
       ? money(h.total - h.received) + ' owed by couple' : 'couple paid up') + '</span>'
   + (owed ? '<span class="chip c-amb">' + money(owed) + ' owed to crew</span>' : '')
   + '<span class="chip">albums revised ' + d.revisions.photo + '/2</span>'
   + '<span class="chip">video revised ' + d.revisions.video + '/2</span>'
   + '</div>'
   + '<div class="crewstrip">'
   + personChip('Photo editor', h.photoEd)
   + personChip('Video editor', h.videoEd)
   + '<button class="person" style="cursor:pointer" onclick="S.sub=\'crew\';paintDetail()">'
   + '<span class="av" style="background:var(--glassHi);color:var(--sub)">' + d.crew.length + '</span>'
   + '<span><span class="pl">Freelance crew</span><span class="pv">'
   + d.crew.filter(function(c){return c.ok}).length + ' of ' + d.crew.length + ' confirmed</span></span></button>'
   + '</div>'
   + '</div>' + ring(pct, 62, 5.5, 14) + '</div></div>'
   + '<div class="seg" style="margin-bottom:14px">'
   + [['flow','Flow'],['crew','Crew'],['money','Money'],['files','Files'],['log','Activity']]
       .map(function (t) { return '<button class="' + (S.sub===t[0]?'on':'') + '" onclick="S.sub=\''
         + t[0] + '\';paintDetail()">' + t[1] + '</button>' }).join('')
   + '</div><div id="subview"></div></div>';
  $('#view').innerHTML = out;
  var sv = document.getElementById('subview');
  if (S.sub === 'flow')  sv.innerHTML = tabFlow(d);
  if (S.sub === 'crew')  sv.innerHTML = tabCrew(d);
  if (S.sub === 'money') sv.innerHTML = tabMoney(d);
  if (S.sub === 'files') sv.innerHTML = tabFiles(d);
  if (S.sub === 'log')   sv.innerHTML = tabLog(d);
}

function personChip(label, name) {
  var has = !!name;
  return '<button class="person' + (has ? '' : ' none') + '" style="cursor:pointer"'
   + ' onclick="S.sub=\'crew\';paintDetail()">'
   + (has ? av(name, 28) : '<span class="av" style="background:var(--tintRose);color:var(--rose)">!</span>')
   + '<span><span class="pl">' + label + '</span>'
   + '<span class="pv">' + (has ? esc(name) : 'nobody yet') + '</span></span></button>';
}

function tabFlow(d) {
  var order = Object.keys(d.phases);
  var nav = '', body = '';
  order.forEach(function (code) {
    var list = d.rows.filter(function (r) { return r.phase === d.phases[code] });
    if (!list.length) return;
    var dn = list.filter(function (r) { return r.done }).length;
    var lt = list.filter(function (r) { return !r.done && r.diff < 0 }).length;
    nav += '<button class="phbtn" onclick="document.getElementById(\'ph' + code
      + '\').scrollIntoView({block:\'start\'})"><span class="pn">' + esc(d.phases[code]) + '</span>'
      + (lt ? '<span class="chip c-rose" style="padding:1px 6px;font-size:10px">' + lt + '</span>' : '')
      + '<span class="mini"><i style="width:' + (dn/list.length*100) + '%"></i></span>'
      + '<span class="pc">' + dn + '/' + list.length + '</span></button>';
    body += '<div class="phsec" id="ph' + code + '"><div class="phhead"><h3>' + esc(d.phases[code]) + '</h3>'
      + (lt ? '<span class="chip c-rose">' + lt + ' late</span>' : '')
      + '<span class="tiny mono" style="margin-left:auto">' + dn + ' of ' + list.length + '</span></div>'
      + '<div class="stack">' + list.map(function (r) {
          return taskRow(r, d.head.name, false, true) }).join('') + '</div></div>';
  });
  return '<div class="flowgrid"><div class="phnav">' + nav + '</div><div>' + body + '</div></div>';
}

function tabCrew(d) {
  var owed = d.crew.reduce(function (s, c) { return s + (c.paid ? 0 : c.fee) }, 0);
  var unconfirmed = d.crew.filter(function (c) { return !c.ok }).length;
  var h = '<div class="bento">'
   + '<div class="glass cell b8"><div class="cellhead"><h3>Freelance crew</h3>'
   + '<span class="chip">' + d.crew.filter(function(c){return c.ok}).length + ' of '
   + d.crew.length + ' confirmed</span>'
   + '<button class="btn sm" style="margin-left:auto" onclick="addCrewModal()">' + svg('plus') + 'Add</button></div>';
  if (unconfirmed) h += '<div class="notice n-rose" style="margin-bottom:11px"><div class="nb2">'
    + '<b>' + unconfirmed + ' has not confirmed</b>Allocated is not the same as accepted. '
    + 'Chase them, or use the reserve.</div></div>';
  if (!d.crew.length) h += '<div class="empty"><b>No crew yet.</b>Malith allocates photographers and videographers here.</div>';
  else {
    h += '<table class="t"><thead><tr><th>Name</th><th>Role</th><th>Said yes</th><th>Fee</th><th>Paid</th><th></th></tr></thead><tbody>'
     + d.crew.map(function (c) {
       return '<tr' + (c.ok ? '' : ' class="warn"') + '>'
        + '<td><div style="font-weight:500">' + esc(c.name) + '</div>'
        + '<div class="tiny mono">' + esc(c.phone) + '</div>'
        + (c.note ? '<div class="tiny">' + esc(c.note) + '</div>' : '') + '</td>'
        + '<td class="tiny">' + esc(c.role) + '</td>'
        + '<td><button class="toggle' + (c.ok?' on':'') + '" onclick="crewSet(' + c.row + ',\'ok\','
        + (!c.ok) + ')"><i></i></button></td>'
        + '<td class="mono">' + (c.fee ? money(c.fee) : '&mdash;') + '</td>'
        + '<td>' + (c.fee ? '<button class="toggle' + (c.paid?' on':'') + '" onclick="crewSet(' + c.row
        + ',\'paid\',' + (!c.paid) + ')"><i></i></button>' : '<span class="tiny">reserve</span>') + '</td>'
        + '<td><button class="tbtn" style="width:30px;height:30px" onclick="crewDel(' + c.row + ',\''
        + esc(c.name) + '\')">' + svg('trash','width="15" height="15"') + '</button></td></tr>';
     }).join('') + '</tbody></table>';
  }
  h += '</div>'
   + '<div class="glass cell b4"><div class="cellhead"><h3>In-house</h3></div>'
   + editorSelect('photo','Photo editor', d.head.photoEd, S.people || [])
   + editorSelect('video','Video editor', d.head.videoEd, S.people || [])
   + '<div class="sep"></div>'
   + '<div class="kv"><span>Album revisions used</span><b>' + d.revisions.photo + ' / 2 free</b></div>'
   + '<div class="kv"><span>Video revisions used</span><b>' + d.revisions.video + ' / 2 free</b></div>'
   + '<div class="kv"><span>Still owed to crew</span><b style="color:' + (owed?'var(--rose)':'var(--brand)')
   + '">' + money(owed) + '</b></div>'
   + '</div></div>';
  return h;
}
function editorSelect(field, label, val, opts) {
  return '<div class="field"><label class="lab">' + label + '</label>'
   + '<select class="in" onchange="doAlloc(\'' + field + '\',this.value)">'
   + '<option value="">Not allocated</option>'
   + opts.map(function (o) { return '<option' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>' }).join('')
   + '</select></div>';
}
function doAlloc(field, person) {
  api('allocate', { name:S.open, field:field, person:person })
   .then(function () { toast(person ? person + ' allocated' : 'Cleared'); openW(S.open, true) })
   .catch(function (e) { toast(e.message, true) });
}
function crewSet(row, field, value) {
  api('setCrew', { row:row, field:field, value:value })
   .then(function () { openW(S.open, true) })
   .catch(function (e) { toast(e.message, true) });
}
function crewDel(row, name) {
  modal('<h2>Remove ' + esc(name) + '?</h2><p class="sub">This clears their row on the Crew and money tab. '
   + 'It does not change anything else.</p><div class="rowf" style="margin-top:18px">'
   + '<button class="btn ghost" onclick="closeOv()">Cancel</button>'
   + '<button class="btn danger" style="flex:1" onclick="closeOv();api(\'removeCrew\',{row:' + row
   + '}).then(function(){toast(\'Removed\');openW(S.open,true)})">Remove</button></div>');
}
function addCrewModal() {
  modal('<h2>Add crew</h2>'
   + '<div class="field"><label class="lab">Name</label><input class="in" id="cn"></div>'
   + '<div class="field"><label class="lab">Role</label><select class="in" id="cr">'
   + ['Lead photographer','Second photographer','Lead videographer','Second videographer',
      'Reserve photographer','Reserve videographer','Drone operator','Assistant']
      .map(function (r) { return '<option>' + r + '</option>' }).join('') + '</select></div>'
   + '<div class="grid2"><div class="field"><label class="lab">Fee (0 for reserve)</label>'
   + '<input class="in" id="cf" inputmode="numeric" value="0"></div>'
   + '<div class="field"><label class="lab">Phone</label><input class="in" id="cp" inputmode="tel"></div></div>'
   + '<div class="rowf" style="margin-top:6px"><button class="btn ghost" onclick="closeOv()">Cancel</button>'
   + '<button class="btn" style="flex:1" onclick="saveCrew()">Add</button></div>');
}
function saveCrew() {
  var n = $('#cn').value.trim(); if (!n) return toast('Name?', true);
  api('addCrew', { couple:S.open, name:n, role:$('#cr').value, fee:$('#cf').value, phone:$('#cp').value })
   .then(function () { closeOv(); toast(n + ' added'); openW(S.open, true) })
   .catch(function (e) { toast(e.message, true) });
}
</script>

<script>
/* ================= money / files / activity tabs ================= */
function tabMoney(d) {
  var h = d.head, bal = h.total - h.received;
  var owed = d.crew.reduce(function (s, c) { return s + (c.paid ? 0 : c.fee) }, 0);
  return '<div class="bento">'
   + '<div class="glass cell b4"><div class="cellhead"><h3>The couple</h3></div>'
   + '<div class="field"><label class="lab">Total agreed (LKR)</label>'
   + '<input class="in mono" id="mT" value="' + h.total + '" inputmode="numeric"'
   + ' onblur="setMoney(\'total\',this.value)"></div>'
   + '<div class="field"><label class="lab">Received so far (LKR)</label>'
   + '<input class="in mono" id="mR" value="' + h.received + '" inputmode="numeric"'
   + ' onblur="setMoney(\'received\',this.value)"></div>'
   + '<div class="kv"><span>Balance</span><b style="color:' + (bal>0?'var(--rose)':'var(--brand)') + '">'
   + money(bal) + '</b></div>'
   + (bal > 0 ? '<button class="btn wide" style="margin-top:12px" onclick="setMoney(\'received\','
       + h.total + ',1)">Mark paid in full</button>' : '')
   + '<div class="sep"></div><div class="tiny">' + esc(h.pkg || 'No package recorded. Write it on the '
   + 'wedding tab so nobody argues at delivery.') + '</div></div>'

   + '<div class="glass cell b4"><div class="cellhead"><h3>Freelancers</h3></div>'
   + (d.crew.filter(function(c){return c.fee}).length
      ? d.crew.filter(function (c) { return c.fee }).map(function (c) {
          return '<div class="kv"><span>' + esc(c.name) + '</span><b style="color:'
            + (c.paid ? 'var(--brand)' : 'var(--amber)') + '">' + money(c.fee)
            + (c.paid ? ' &#10003;' : '') + '</b></div>' }).join('')
      : '<div class="tiny">No fees recorded yet.</div>')
   + '<div class="sep"></div><div class="kv"><span><b>Still owed</b></span>'
   + '<b style="color:' + (owed?'var(--rose)':'var(--brand)') + '">' + money(owed) + '</b></div></div>'

   + '<div class="glass cell b4"><div class="cellhead"><h3>Colour lab</h3></div>'
   + (d.files.lab
      ? '<div class="field"><label class="lab">Lab job number and cost</label>'
        + '<input class="in" value="' + esc(d.files.lab.note) + '" placeholder="e.g. CL-2261, LKR 18,000"'
        + ' onblur="doNote(\'' + esc(h.name) + '\',' + d.files.lab.row + ',this.value)"></div>'
        + '<div class="kv"><span>Sent to lab</span><b style="color:'
        + (d.files.lab.done ? 'var(--brand)' : 'var(--faint)') + '">'
        + (d.files.lab.done ? 'yes' : 'not yet') + '</b></div>'
      : '<div class="tiny">The lab step is not on this wedding tab.</div>')
   + '<div class="sep"></div>'
   + '<div class="tiny">Album collection is due within two weeks of sending. '
   + 'Check the print before it goes to the couple.</div></div></div>';
}
function setMoney(field, value, full) {
  api('setMoney', { name:S.open, field:field, value:value })
   .then(function () { toast(full ? 'Marked paid in full' : 'Saved'); openW(S.open, true) })
   .catch(function (e) { toast(e.message, true) });
}

function tabFiles(d) {
  var f = d.files, h = d.head;
  var have3 = f.offsite && f.offsite.note;
  var out = '<div class="bento">';
  if (!have3) out += '<div class="glass cell b12"><div class="notice n-rose"><span class="bell">&#9888;</span>'
    + '<div class="nb2"><b>There is no third copy of this wedding</b>'
    + 'Two disks in one office is one copy. A fire, a theft or a dropped bag ends this wedding for good, '
    + 'and you cannot reshoot it.</div></div></div>';

  out += '<div class="glass cell b8"><div class="cellhead"><h3>Where the raw files live</h3></div>'
   + diskField('Hard disk 1', f.disk1, h.name, 'Disk label and where it is kept')
   + diskField('Hard disk 2', f.disk2, h.name, 'Disk label and where it is kept')
   + diskField('Third copy, offsite or cloud', f.offsite, h.name, 'Drive folder or other building')
   + '<div class="sep"></div>'
   + diskField('SD cards issued', f.cards, h.name, 'How many went out, and to whom')
   + '</div>'

   + '<div class="glass cell b4"><div class="cellhead"><h3>Before you format anything</h3></div>'
   + gate('Both copies verified', f.verified)
   + gate('All cards collected', f.collected)
   + gate('Cards formatted and returned', f.formatted)
   + '<div class="sep"></div>'
   + (f.verified
      ? '<div class="notice n-amb" style="font-size:12px"><div class="nb2">Verified. Cards are safe to format.</div></div>'
      : '<div class="notice n-rose" style="font-size:12px"><div class="nb2"><b>Not verified yet</b>'
        + 'Do not format a single card until file counts and total size match on both disks.</div></div>')
   + '</div></div>';
  return out;
}
function diskField(label, slot, couple, ph) {
  if (!slot) return '<div class="field"><label class="lab">' + label + '</label>'
    + '<div class="tiny">That step is not on this wedding tab.</div></div>';
  return '<div class="field"><label class="lab">' + label
   + (slot.done ? ' <span class="chip c-brand" style="padding:1px 7px">done</span>' : '') + '</label>'
   + '<input class="in" value="' + esc(slot.note) + '" placeholder="' + ph + '"'
   + ' onblur="doNote(\'' + esc(couple) + '\',' + slot.row + ',this.value)"></div>';
}
function gate(label, ok) {
  return '<div class="kv"><span>' + label + '</span><b style="color:'
   + (ok ? 'var(--brand)' : 'var(--rose)') + '">' + (ok ? 'yes' : 'not yet') + '</b></div>';
}

function tabLog(d) {
  return '<div class="glass cell"><div class="cellhead"><h3>Who did what</h3>'
   + '<span class="more">last ' + d.log.length + '</span></div>'
   + (d.log.length ? d.log.map(feedRow).join('')
      : '<div class="empty"><b>Nothing recorded yet.</b>Every tick, note and change lands here.</div>')
   + '</div>';
}
function feedRow(l) {
  return '<div class="feed">' + av(l.who, 24)
   + '<div class="fw"><div>' + esc(l.what) + '</div>'
   + '<div class="tiny">' + esc(l.who) + (l.couple ? ' &middot; ' + esc(l.couple) : '') + '</div></div>'
   + '<div class="ft">' + esc(l.when) + '</div></div>';
}

/* ================= board ================= */
function viewBoard() {
  spin();
  api('board').then(function (b) {
    var share = {}, top = null;
    b.people.forEach(function (p) {
      share[p] = b.totalOpen ? Math.round(b.open[p] / b.totalOpen * 100) : 0;
      if (!top || share[p] > share[top]) top = p;
    });
    var noCopy = b.weddings.filter(function (w) { return !w.thirdCopy });
    var h = '<div class="wrap"><div class="seg" style="margin-bottom:14px">'
     + [['workload','Workload'],['late','Late'],['money','Money'],['feed','Activity']]
        .map(function (t) { return '<button class="' + (S.bt===t[0]?'on':'') + '" onclick="S.bt=\''
          + t[0] + '\';viewBoardPaint()">' + t[1] + '</button>' }).join('')
     + '</div><div id="bview"></div></div>';
    $('#view').innerHTML = h;
    S.board = b; S.share = share; S.topPerson = top; S.noCopy = noCopy;
    viewBoardPaint();
  }).catch(fail);
}
function viewBoardPaint() {
  var b = S.board, share = S.share, top = S.topPerson, h = '';
  if (S.bt === 'workload') {
    h = '<div class="bento">'
     + b.people.map(function (p) {
       return '<div class="glass cell b3"><div class="rowf">' + av(p, 30)
        + '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">' + esc(p) + '</div>'
        + '<div class="tiny">' + b.open[p] + ' open</div></div></div>'
        + '<div class="big" style="margin-top:12px;color:' + (b.counts[p]?'var(--rose)':'var(--brand)') + '">'
        + b.counts[p] + '</div><div class="tiny">late</div>'
        + '<div class="mini" style="width:100%;margin-top:10px"><i style="width:' + share[p] + '%"></i></div>'
        + '<div class="tiny mono" style="margin-top:5px">' + share[p] + '% of all open work</div></div>';
     }).join('');
    if (top && share[top] > 45) h += '<div class="glass cell b12"><div class="notice n-amb">'
      + '<span class="bell">&#9888;</span><div class="nb2"><b>' + share[top]
      + '% of all open work sits with ' + esc(top) + '</b>'
      + 'If they are sick, on leave, or resign, that share of the business stops. '
      + 'Every step needs a named second person.</div></div></div>';
    if (S.noCopy.length) h += '<div class="glass cell b12"><div class="notice n-rose">'
      + '<span class="bell">&#9888;</span><div class="nb2"><b>' + S.noCopy.length
      + ' wedding' + (S.noCopy.length===1?'':'s') + ' with no third copy of the files</b>'
      + S.noCopy.map(function(w){return esc(w.name)}).join(', ') + '</div></div></div>';
    h += '</div>';
  }
  if (S.bt === 'late') {
    h = '<div class="glass cell">' + (b.late.length
      ? '<div class="cellhead"><h3>Oldest first</h3><span class="chip c-rose">' + b.late.length + '</span></div>'
        + '<div class="stack">' + b.late.map(function (r) { return taskRow(r, r.couple, true) }).join('') + '</div>'
      : '<div class="empty"><b>Nothing is late anywhere.</b>Rare. Enjoy it.</div>') + '</div>';
  }
  if (S.bt === 'money') {
    h = '<div class="bento">'
     + '<div class="glass cell b6"><div class="eyebrow">Owed by couples</div>'
     + '<div class="big" style="margin-top:10px;color:' + (b.clientDue?'var(--rose)':'var(--brand)') + '">'
     + money(b.clientDue) + '</div><div class="tiny" style="margin-top:4px">LKR</div></div>'
     + '<div class="glass cell b6"><div class="eyebrow">Owed to freelancers</div>'
     + '<div class="big" style="margin-top:10px;color:' + (b.crewOwed?'var(--amber)':'var(--brand)') + '">'
     + money(b.crewOwed) + '</div><div class="tiny" style="margin-top:4px">LKR</div></div>'
     + '<div class="glass cell b12"><div class="cellhead"><h3>Every wedding</h3></div>'
     + '<table class="t"><thead><tr><th>Couple</th><th>Date</th><th>Late</th>'
     + '<th>Couple owes</th><th>Crew owed</th><th>Third copy</th></tr></thead><tbody>'
     + b.weddings.map(function (w) {
       return '<tr' + (w.thirdCopy ? '' : ' class="warn"') + '>'
        + '<td><button style="font-weight:500" onclick="openW(\'' + esc(w.name) + '\')">'
        + esc(w.name) + '</button></td>'
        + '<td class="mono tiny">' + fmt(w.date) + '</td>'
        + '<td>' + (w.late ? '<span class="chip c-rose">' + w.late + '</span>' : '&mdash;') + '</td>'
        + '<td class="mono">' + money(w.balance) + '</td>'
        + '<td class="mono">' + money(w.owed) + '</td>'
        + '<td>' + (w.thirdCopy ? '<span class="chip c-brand">yes</span>'
                                : '<span class="chip c-rose">NO</span>') + '</td></tr>';
     }).join('') + '</tbody></table></div></div>';
  }
  if (S.bt === 'feed') {
    h = '<div class="glass cell"><div class="cellhead"><h3>Everything, newest first</h3></div>'
     + (b.feed.length ? b.feed.map(feedRow).join('')
        : '<div class="empty"><b>Nothing recorded yet.</b></div>') + '</div>';
  }
  var el = document.getElementById('bview'); if (el) el.innerHTML = h;
}
</script>
<script>
/* ================= finance ================= */
var FIN = { tab:'pnl', preset:'month', from:'', to:'', month:'' };

function d2(n){ return (n<10?'0':'')+n }
function isoD(d){ return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()) }
function presetRange(k) {
  var n = new Date(), y = n.getFullYear(), m = n.getMonth();
  if (k === 'month')  return [isoD(new Date(y,m,1)), isoD(new Date(y,m+1,0))];
  if (k === 'last')   return [isoD(new Date(y,m-1,1)), isoD(new Date(y,m,0))];
  if (k === 'quarter'){ var q = Math.floor(m/3)*3; return [isoD(new Date(y,q,1)), isoD(new Date(y,q+3,0))]; }
  if (k === 'year')   return [isoD(new Date(y,0,1)), isoD(new Date(y,11,31))];
  if (k === 'lastyear')return [isoD(new Date(y-1,0,1)), isoD(new Date(y-1,11,31))];
  return ['',''];
}
function rangeLabel() {
  if (FIN.preset === 'all') return 'Everything on record';
  if (!FIN.from && !FIN.to) return 'All dates';
  return fmt(FIN.from) + '  to  ' + fmt(FIN.to);
}
function setPreset(k) {
  FIN.preset = k;
  if (k !== 'custom') { var r = presetRange(k); FIN.from = r[0]; FIN.to = r[1]; }
  viewFinance();
}
function setCustom() {
  FIN.preset = 'custom';
  FIN.from = $('#fFrom').value; FIN.to = $('#fTo').value;
  viewFinance();
}

function viewFinance() {
  if (!FIN.from && FIN.preset === 'month') { var r = presetRange('month'); FIN.from = r[0]; FIN.to = r[1]; }
  var head = '<div class="wrap">'
   + '<div class="rowf" style="flex-wrap:wrap;gap:9px;margin-bottom:6px">'
   + '<div class="seg">' + [['pnl','Profit and loss'],['ledger','Statement'],['salary','Salaries']]
       .map(function (t) { return '<button class="' + (FIN.tab===t[0]?'on':'') + '" onclick="FIN.tab=\''
         + t[0] + '\';viewFinance()">' + t[1] + '</button>' }).join('') + '</div>'
   + '<button class="btn" style="margin-left:auto" onclick="entryModal()">' + svg('plus') + 'Record money</button>'
   + '</div>';
  if (FIN.tab !== 'salary') {
    head += '<div class="rowf" style="flex-wrap:wrap;gap:9px;margin:10px 0 14px">'
     + '<div class="seg">' + [['month','This month'],['last','Last month'],['quarter','This quarter'],
         ['year','This year'],['lastyear','Last year'],['all','All'],['custom','Custom']]
        .map(function (t) { return '<button class="' + (FIN.preset===t[0]?'on':'') + '" onclick="setPreset(\''
          + t[0] + '\')">' + t[1] + '</button>' }).join('') + '</div>'
     + (FIN.preset === 'custom'
        ? '<input class="in" type="date" id="fFrom" value="' + FIN.from + '" style="width:auto" onchange="setCustom()">'
          + '<span class="tiny">to</span>'
          + '<input class="in" type="date" id="fTo" value="' + FIN.to + '" style="width:auto" onchange="setCustom()">'
        : '<span class="chip">' + rangeLabel() + '</span>')
     + '</div>';
  }
  $('#view').innerHTML = head + '<div id="fin"><div class="spin"><i></i></div></div></div>';

  if (FIN.tab === 'pnl') {
    api('pnl', { from:FIN.from, to:FIN.to }).then(paintPnl).catch(finFail);
  } else if (FIN.tab === 'ledger') {
    api('ledger', { from:FIN.from, to:FIN.to }).then(paintLedger).catch(finFail);
  } else {
    if (!FIN.month) FIN.month = isoD(new Date()).slice(0,7);
    api('salaries', { month:FIN.month }).then(paintSalaries).catch(finFail);
  }
}
function finFail(e) {
  var el = document.getElementById('fin'); if (!el) return;
  el.innerHTML = '<div class="empty"><b>Could not load the figures.</b>' + esc(e.message) + '</div>';
}

function paintPnl(p) {
  var pos = p.net >= 0;
  var margin = p.inTot ? Math.round(p.net / p.inTot * 100) : 0;
  var months = Object.keys(p.byMonth).sort();
  var peak = months.reduce(function (m, k) {
    return Math.max(m, p.byMonth[k].inn, p.byMonth[k].out) }, 1);

  var h = '<div class="bento">'
   + '<div class="glass cell b3"><div class="eyebrow">Money in</div>'
   + '<div class="big" style="margin-top:auto;padding-top:10px;color:var(--brand)">' + money(p.inTot) + '</div>'
   + '<div class="tiny" style="margin-top:4px">LKR</div></div>'
   + '<div class="glass cell b3"><div class="eyebrow">Money out</div>'
   + '<div class="big" style="margin-top:auto;padding-top:10px;color:var(--amber)">' + money(p.outTot) + '</div>'
   + '<div class="tiny" style="margin-top:4px">LKR</div></div>'
   + '<div class="glass cell b3"><div class="eyebrow">' + (pos ? 'Profit' : 'Loss') + '</div>'
   + '<div class="big" style="margin-top:auto;padding-top:10px;color:' + (pos?'var(--brand)':'var(--rose)') + '">'
   + money(Math.abs(p.net)) + '</div><div class="tiny" style="margin-top:4px">LKR</div></div>'
   + '<div class="glass cell b3"><div class="eyebrow">Margin</div>'
   + '<div class="big" style="margin-top:auto;padding-top:10px;color:' + (pos?'var(--brand)':'var(--rose)') + '">'
   + margin + '%</div><div class="tiny" style="margin-top:4px">of money in</div></div>';

  if (!p.count) {
    h += '<div class="glass cell b12"><div class="empty"><b>Nothing recorded in this window.</b>'
      + 'Use <b>Record money</b> above, or widen the dates.</div></div></div>';
    document.getElementById('fin').innerHTML = h; return;
  }

  h += '<div class="glass cell b6"><div class="cellhead"><h3>Profit and loss</h3>'
   + '<span class="more">' + rangeLabel() + '</span></div>'
   + line('Income', p.inTot, 'strong');
  Object.keys(p.income).forEach(function (k) { h += line('&nbsp;&nbsp;' + k, p.income[k], 'sub'); });
  h += '<div class="sep"></div>'
   + line('Less direct costs', -p.direct, '')
   + line('&nbsp;&nbsp;Freelancers', -(p.expense['Freelancer']||0), 'sub')
   + line('&nbsp;&nbsp;Colour lab', -(p.expense['Colour lab']||0), 'sub')
   + line('Gross profit', p.gross, 'strong')
   + '<div class="sep"></div>'
   + line('Less salaries', -p.salary, '')
   + line('Less overheads', -p.overhead, '');
  Object.keys(p.expense).forEach(function (k) {
    if (k === 'Freelancer' || k === 'Colour lab' || k === 'Salary') return;
    h += line('&nbsp;&nbsp;' + k, -p.expense[k], 'sub');
  });
  h += '<div class="sep"></div>'
   + line(pos ? 'Net profit' : 'Net loss', p.net, 'total') + '</div>';

  h += '<div class="glass cell b6"><div class="cellhead"><h3>Month by month</h3></div>'
   + (months.length ? months.map(function (m) {
       var b = p.byMonth[m], net = b.inn - b.out;
       return '<div style="margin-bottom:11px"><div class="rowf" style="font-size:12px">'
        + '<span class="mono">' + m + '</span>'
        + '<span class="mono" style="margin-left:auto;color:' + (net>=0?'var(--brand)':'var(--rose)') + '">'
        + (net>=0?'+':'-') + money(Math.abs(net)) + '</span></div>'
        + '<div style="display:flex;gap:3px;margin-top:5px">'
        + '<div style="flex:' + Math.max(b.inn/peak*100,1) + ';height:7px;border-radius:99px;background:var(--brand)"></div>'
        + '<div style="flex:' + Math.max(b.out/peak*100,1) + ';height:7px;border-radius:99px;background:var(--amber)"></div>'
        + '<div style="flex:' + Math.max((peak-Math.max(b.inn,b.out))/peak*100,1) + '"></div></div></div>';
     }).join('') : '<div class="tiny">No months in range.</div>')
   + '<div class="sep"></div><div class="rowf tiny" style="gap:14px">'
   + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--brand)"></i> in</span>'
   + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--amber)"></i> out</span>'
   + '</div></div>';

  var wk = Object.keys(p.byWedding);
  if (wk.length) {
    h += '<div class="glass cell b12"><div class="cellhead"><h3>What each wedding brought in</h3></div>'
     + '<table class="t"><thead><tr><th>Wedding</th><th>In</th><th>Direct cost</th><th>Contribution</th></tr></thead><tbody>'
     + wk.sort(function (a,b) { return (p.byWedding[b].inn - p.byWedding[b].out) - (p.byWedding[a].inn - p.byWedding[a].out) })
        .map(function (k) {
       var b = p.byWedding[k], c = b.inn - b.out;
       return '<tr><td><button style="font-weight:500" onclick="openW(\'' + esc(k) + '\')">' + esc(k) + '</button></td>'
        + '<td class="mono">' + money(b.inn) + '</td><td class="mono">' + money(b.out) + '</td>'
        + '<td class="mono" style="color:' + (c>=0?'var(--brand)':'var(--rose)') + '">' + money(c) + '</td></tr>';
     }).join('') + '</tbody></table></div>';
  }
  document.getElementById('fin').innerHTML = h + '</div>';
}
function line(label, amt, kind) {
  var col = kind === 'total' ? (amt>=0?'var(--brand)':'var(--rose)') : 'inherit';
  var w = (kind === 'strong' || kind === 'total') ? '600' : '400';
  var sz = kind === 'total' ? '16px' : kind === 'sub' ? '12.5px' : '13px';
  return '<div class="kv" style="font-size:' + sz + ';font-weight:' + w
   + (kind==='sub'?';opacity:.72;border-bottom:none;padding:4px 0':'') + '">'
   + '<span>' + label + '</span><b style="color:' + col + ';font-size:' + sz + '">'
   + (amt < 0 ? '(' + money(Math.abs(amt)) + ')' : money(amt)) + '</b></div>';
}

function paintLedger(rows) {
  var inn = rows.filter(function (r) { return r.dir==='In' }).reduce(function (s,r) { return s+r.amount },0);
  var out = rows.filter(function (r) { return r.dir!=='In' }).reduce(function (s,r) { return s+r.amount },0);
  var h = '<div class="glass cell"><div class="cellhead"><h3>Statement</h3>'
   + '<span class="chip">' + rows.length + ' lines</span>'
   + '<span class="more">' + rangeLabel() + '</span></div>';
  if (!rows.length) h += '<div class="empty"><b>Nothing in this window.</b>Record something, or widen the dates.</div>';
  else h += '<table class="t"><thead><tr><th>Date</th><th>Category</th><th>Description</th>'
   + '<th>Wedding</th><th style="text-align:right">In</th><th style="text-align:right">Out</th>'
   + '<th>By</th><th></th></tr></thead><tbody>'
   + rows.map(function (r) {
     return '<tr><td class="mono tiny">' + fmt(r.date) + '</td>'
      + '<td><span class="chip ' + (r.dir==='In'?'c-brand':'') + '">' + esc(r.category) + '</span></td>'
      + '<td>' + esc(r.note || '&mdash;') + '</td>'
      + '<td class="tiny">' + esc(r.wedding || '&mdash;') + '</td>'
      + '<td class="mono" style="text-align:right;color:var(--brand)">' + (r.dir==='In'?money(r.amount):'') + '</td>'
      + '<td class="mono" style="text-align:right;color:var(--amber)">' + (r.dir!=='In'?money(r.amount):'') + '</td>'
      + '<td class="tiny">' + esc(r.by) + '</td>'
      + '<td>' + (S.user.role==='Owner' ? '<button class="tbtn" style="width:28px;height:28px"'
          + ' onclick="delEntry(' + r.row + ')">' + svg('trash','width="14" height="14"') + '</button>' : '') + '</td></tr>';
   }).join('')
   + '</tbody><tfoot><tr><td colspan="4" style="font-weight:600">Totals</td>'
   + '<td class="mono" style="text-align:right;font-weight:600;color:var(--brand)">' + money(inn) + '</td>'
   + '<td class="mono" style="text-align:right;font-weight:600;color:var(--amber)">' + money(out) + '</td>'
   + '<td colspan="2"></td></tr></tfoot></table>';
  document.getElementById('fin').innerHTML = h + '</div>';
}
function delEntry(row) {
  modal('<h2>Delete this line?</h2><p class="sub">It disappears from the statement and the profit and loss. '
   + 'The row is removed from the Ledger tab.</p><div class="rowf" style="margin-top:18px">'
   + '<button class="btn ghost" onclick="closeOv()">Cancel</button>'
   + '<button class="btn danger" style="flex:1" onclick="closeOv();api(\'deleteEntry\',{row:' + row
   + '}).then(function(){toast(\'Deleted\');viewFinance()}).catch(function(e){toast(e.message,true)})">Delete</button></div>');
}

function entryModal(pre) {
  pre = pre || {};
  var cats = ['Wedding payment','Album and frames','Print sales','Other income',
              'Freelancer','Colour lab','Salary','Rent','Equipment','Transport',
              'Marketing','Software','Travel','Other expense'];
  modal('<h2>Record money</h2>'
   + '<div class="seg" style="margin-bottom:14px;width:100%">'
   + '<button id="dIn" class="on" style="flex:1" onclick="entryDir(1)">Money in</button>'
   + '<button id="dOut" style="flex:1" onclick="entryDir(0)">Money out</button></div>'
   + '<div class="grid2"><div class="field"><label class="lab">Date</label>'
   + '<input class="in" type="date" id="eDate" value="' + isoD(new Date()) + '"></div>'
   + '<div class="field"><label class="lab">Amount (LKR)</label>'
   + '<input class="in mono" id="eAmt" inputmode="numeric" placeholder="0"></div></div>'
   + '<div class="field"><label class="lab">Category</label><select class="in" id="eCat">'
   + cats.map(function (c) { return '<option>' + c + '</option>' }).join('') + '</select></div>'
   + '<div class="field"><label class="lab">Which wedding (optional)</label><select class="in" id="eWed">'
   + '<option value="">Not tied to one</option>'
   + S.weddings.map(function (w) { return '<option>' + esc(w.name) + '</option>' }).join('') + '</select></div>'
   + '<div class="field"><label class="lab">Description</label><input class="in" id="eNote" placeholder="What was it for"></div>'
   + '<div class="field"><label class="lab">Method</label><select class="in" id="eMethod">'
   + ['Bank transfer','Cash','Cheque','Card','Other'].map(function (m) { return '<option>'+m+'</option>' }).join('')
   + '</select></div>'
   + '<div class="rowf" style="margin-top:6px"><button class="btn ghost" onclick="closeOv()">Cancel</button>'
   + '<button class="btn" style="flex:1" id="eGo" onclick="saveEntry()">Record it</button></div>');
  entryDir(1);
}
var ENTRY_DIR = 'In';
function entryDir(isIn) {
  ENTRY_DIR = isIn ? 'In' : 'Out';
  var a = document.getElementById('dIn'), b = document.getElementById('dOut');
  if (a) a.className = isIn ? 'on' : '';
  if (b) b.className = isIn ? '' : 'on';
  var sel = document.getElementById('eCat');
  if (sel) sel.value = isIn ? 'Wedding payment' : 'Freelancer';
}
function saveEntry() {
  var amt = Number($('#eAmt').value);
  if (!amt || amt <= 0) return toast('Put in an amount', true);
  var b = $('#eGo'); b.disabled = true; b.textContent = 'Saving...';
  api('addEntry', { date:$('#eDate').value, dir:ENTRY_DIR, category:$('#eCat').value,
      wedding:$('#eWed').value, note:$('#eNote').value, amount:amt, method:$('#eMethod').value })
   .then(function () { closeOv(); toast('Recorded'); viewFinance() })
   .catch(function (e) { b.disabled = false; b.textContent = 'Record it'; toast(e.message, true) });
}
</script>
<script>
/* ================= salaries ================= */
function monthShift(n) {
  var d = new Date(FIN.month + '-01T00:00:00'); d.setMonth(d.getMonth() + n);
  FIN.month = d.getFullYear() + '-' + d2(d.getMonth() + 1); viewFinance();
}
function monthName(m) {
  var d = new Date(m + '-01T00:00:00');
  return d.toLocaleDateString('en-GB', { month:'long', year:'numeric' });
}
function paintSalaries(s) {
  var paidTot = Object.keys(s.paid).reduce(function (t, k) { return t + s.paid[k].amount }, 0);
  var outstanding = s.people.filter(function (p) { return p.active && p.monthly && !s.paid[p.name] })
                            .reduce(function (t, p) { return t + p.monthly }, 0);
  var h = '<div class="bento">'
   + '<div class="glass cell b12"><div class="rowf" style="flex-wrap:wrap;gap:10px">'
   + '<button class="btn ghost sm" onclick="monthShift(-1)">&larr;</button>'
   + '<h3 style="font-size:16px">' + monthName(s.month) + '</h3>'
   + '<button class="btn ghost sm" onclick="monthShift(1)">&rarr;</button>'
   + '<span class="chip" style="margin-left:auto">Monthly bill ' + money(s.due) + '</span>'
   + '<span class="chip c-brand">Paid ' + money(paidTot) + '</span>'
   + (outstanding ? '<span class="chip c-rose">Still to pay ' + money(outstanding) + '</span>'
                  : '<span class="chip c-brand">Everyone paid</span>')
   + '</div></div>'

   + '<div class="glass cell b12"><div class="cellhead"><h3>The team on salary</h3>'
   + '<span class="more">editors, coordinator, anyone on the payroll</span></div>'
   + '<table class="t"><thead><tr><th>Person</th><th>Monthly (LKR)</th><th>On payroll</th>'
   + '<th>' + monthName(s.month) + '</th><th></th></tr></thead><tbody>'
   + s.people.map(function (p) {
     var pd = s.paid[p.name];
     return '<tr' + (p.active && p.monthly && !pd ? ' class="warn"' : '') + '>'
      + '<td><div class="rowf" style="gap:9px">' + av(p.name, 28)
      + '<div><div style="font-weight:600">' + esc(p.name) + '</div>'
      + (p.note ? '<div class="tiny">' + esc(p.note) + '</div>' : '') + '</div></div></td>'
      + '<td><input class="in mono" style="width:130px;padding:6px 9px" inputmode="numeric" value="'
      + (p.monthly || '') + '" placeholder="0" onblur="salSet(\'' + esc(p.name) + '\',this.value)"></td>'
      + '<td><button class="toggle' + (p.active ? ' on' : '') + '" onclick="salActive(\'' + esc(p.name)
      + '\',' + (!p.active) + ',' + (p.monthly||0) + ')"><i></i></button></td>'
      + '<td>' + (pd
          ? '<span class="chip c-brand">paid ' + money(pd.amount) + '</span>'
            + '<div class="tiny mono" style="margin-top:3px">' + fmt(pd.date) + '</div>'
          : p.active && p.monthly ? '<span class="chip c-rose">not paid</span>'
                                  : '<span class="tiny">&mdash;</span>') + '</td>'
      + '<td style="text-align:right">' + (!pd && p.active && p.monthly
          ? '<button class="btn sm" onclick="payModal(\'' + esc(p.name) + '\',' + p.monthly + ',\''
            + s.month + '\')">Pay</button>' : '') + '</td></tr>';
   }).join('') + '</tbody></table>'
   + '<div class="tiny" style="margin-top:12px;line-height:1.6">Paying somebody writes a line into the '
   + 'statement under <b>Salary</b>, so it lands in the profit and loss automatically. '
   + 'Nothing is counted until it is actually paid.</div></div></div>';
  document.getElementById('fin').innerHTML = h;
}
function salSet(name, val) {
  api('setSalary', { name:name, monthly:val })
   .then(function () { toast('Saved') })
   .catch(function (e) { toast(e.message, true) });
}
function salActive(name, active, monthly) {
  api('setSalary', { name:name, monthly:monthly, active:active })
   .then(function () { viewFinance() })
   .catch(function (e) { toast(e.message, true) });
}
function payModal(name, amount, month) {
  modal('<h2>Pay ' + esc(name) + '</h2>'
   + '<p class="sub" style="margin-bottom:16px">Salary for ' + monthName(month) + '.</p>'
   + '<div class="grid2"><div class="field"><label class="lab">Amount (LKR)</label>'
   + '<input class="in mono" id="sAmt" inputmode="numeric" value="' + amount + '"></div>'
   + '<div class="field"><label class="lab">Date paid</label>'
   + '<input class="in" type="date" id="sDate" value="' + isoD(new Date()) + '"></div></div>'
   + '<div class="field"><label class="lab">Method</label><select class="in" id="sMethod">'
   + ['Bank transfer','Cash','Cheque','Other'].map(function (m) { return '<option>'+m+'</option>' }).join('')
   + '</select></div>'
   + '<div class="rowf" style="margin-top:6px"><button class="btn ghost" onclick="closeOv()">Cancel</button>'
   + '<button class="btn" style="flex:1" onclick="doPay(\'' + esc(name) + '\',\'' + month + '\')">Record the payment</button></div>');
}
function doPay(name, month) {
  api('paySalary', { name:name, month:month, amount:$('#sAmt').value,
                     date:$('#sDate').value, method:$('#sMethod').value })
   .then(function () { closeOv(); toast(name + ' paid'); viewFinance() })
   .catch(function (e) { toast(e.message, true) });
}
</script>

<script>
/* ================= people (owner only) ================= */
function viewPeople() {
  spin();
  api('listUsers').then(function (us) {
    var active = us.filter(function (u) { return u.status === 'active' });
    var invited = us.filter(function (u) { return u.status === 'invited' });
    var gone = us.filter(function (u) { return u.status === 'removed' });
    var h = '<div class="wrap"><div class="bento">'
     + '<div class="glass cell b12"><div class="notice n-amb"><div class="nb2">'
     + '<b>When somebody resigns, switch them off here</b>'
     + 'It kills their password and their session on the spot. They cannot open the app again, '
     + 'on any device. Their name stays on every step they already ticked, so the record is intact.'
     + '</div></div></div>'
     + '<div class="glass cell b8"><div class="cellhead"><h3>The team</h3>'
     + '<span class="chip">' + active.length + ' signed up</span>'
     + '<button class="btn sm" style="margin-left:auto" onclick="inviteModal()">' + svg('plus') + 'Invite</button></div>'
     + '<table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>'
     + us.map(function (u) {
       var mine = u.email === S.user.email;
       var badge = u.status === 'active'
         ? '<span class="chip c-brand">active</span>'
         : u.status === 'invited'
           ? '<span class="chip c-amb">' + (u.hasPassword ? 'invited' : 'no password yet') + '</span>'
           : '<span class="chip c-rose">switched off</span>';
       return '<tr' + (u.status === 'removed' ? ' class="warn"' : '') + '>'
        + '<td><div class="rowf" style="gap:8px">' + av(u.name || u.email, 24)
        + '<span style="font-weight:500">' + esc(u.name || '(not set yet)')
        + (mine ? ' <span class="tiny">you</span>' : '') + '</span></div></td>'
        + '<td class="tiny mono">' + esc(u.email) + '</td>'
        + '<td class="tiny">' + esc(u.role) + '</td>'
        + '<td>' + badge + '</td>'
        + '<td><div class="rowf" style="gap:5px;justify-content:flex-end">'
        + (mine ? '<span class="tiny">&mdash;</span>'
           : u.status === 'removed'
             ? '<button class="btn sm ghost" onclick="userAct(\'restoreUser\',\'' + esc(u.email)
               + '\',\'Let ' + esc(u.name||u.email) + ' back in?\',\'They will have to set a new password.\')">Restore</button>'
             : '<button class="btn sm ghost" onclick="userAct(\'resetPassword\',\'' + esc(u.email)
               + '\',\'Clear the password for ' + esc(u.name||u.email) + '?\',\'They set a new one next time they open the app.\')">Reset password</button>'

function pickLogo(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  if (f.size > 400000) return toast('That image is too big. Use one under 400 KB.', true);
  var fr = new FileReader();
  fr.onload = function () {
    try { localStorage.setItem('cl.logo', fr.result); } catch (e) { return toast('Could not save it', true); }
    applyLogo(); toast('Logo set'); viewYou();
  };
  fr.readAsDataURL(f);

/* ================= reminders on the phone =================
   Fires at two days out, one day out, on the day, and when late.
   One buzz per step per threshold per day, so it never nags twice. */
var NOTIF_EVERY = 20 * 60 * 1000;

function notifState() {
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission;                      // granted | denied | default
}
function askNotifications() {
  if (!('Notification' in window)) return toast('This browser cannot show reminders', true);
  Notification.requestPermission().then(function (p) {
    if (p === 'granted') { toast('Reminders on'); buzz(); checkReminders(true); }
    else if (p === 'denied') toast('Blocked. Turn it back on in your browser settings.', true);
    if (S.view === 'you') viewYou();
  });
}
function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern || [180, 90, 180]); } catch (e) {}
}
function show(title, body, tag) {
  var opts = { body:body, tag:tag, renotify:false, icon:'./icons/icon-192.png',
               badge:'./icons/icon-192.png', vibrate:[180,90,180],
               data:{ url: location.href } };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      if (reg && reg.showNotification) return reg.showNotification(title, opts);
      try { new Notification(title, opts); } catch (e) {}
    }).catch(function () { try { new Notification(title, opts); } catch (e) {} });
  }
  try { new Notification(title, opts); } catch (e) {}
}
function seen(key) {
  var today = isoD(new Date()), k = 'notif:' + key + ':' + today;
  try { if (localStorage.getItem(k)) return true; localStorage.setItem(k, '1'); } catch (e) {}
  return false;
}
function pruneSeen() {
  var today = isoD(new Date());
  try {
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var k = localStorage.key(i);
      if (k && k.indexOf('notif:') === 0 && k.slice(-10) !== today) localStorage.removeItem(k);
    }
  } catch (e) {}
}
function checkReminders(force) {
  if (!S.user || notifState() !== 'granted') return;
  pruneSeen();
  api('dueSoon').then(function (list) {
    var fired = 0, skipped = 0, CAP = 4;      // a backlog should not become 14 buzzes
    list.forEach(function (t) {
      var band = t.diff < 0 ? 'late' : String(t.diff);      // late | 0 | 1 | 2
      if (!force && seen(t.couple + ':' + t.row + ':' + band)) return;
      if (force && fired) return;
      if (!force && fired >= CAP) { skipped++; return; }
      var when = t.diff === 2 ? 'Due in 2 days'
               : t.diff === 1 ? 'Due tomorrow'
               : t.diff === 0 ? 'Due today'
               : Math.abs(t.diff) + ' days late';
      show(when + ' \u2014 ' + t.couple, t.task, t.couple + ':' + t.row + ':' + band);
      fired++;
    });
    if (skipped) show('Ceylon Limerance',
      'And ' + skipped + ' more waiting on you. Open the app to see the lot.', 'more');
    if (fired) buzz(fired > 2 ? [200,90,200,90,200] : [180,90,180]);
    if (force && !fired) {
      show('Ceylon Limerance', 'Reminders are working. Nothing due in the next two days.', 'test');
      buzz();
    }
  }).catch(function () {});
}
function startReminderLoop() {
  checkReminders();
  setInterval(checkReminders, NOTIF_EVERY);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkReminders();
  });
}
